plugins {
    id 'com.android.application'
}

android {
    def buildSerial = new SimpleDateFormat("MMddHHmm").format(new Date())

    defaultConfig {
        applicationId "io.twoyi"
        compileSdk 37
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        // twoyi's container bootstrap execs rootfs/init from the app-private
        // data dir, which stock SELinux only permits for the legacy
        // untrusted_app_27 partition. targetSdk 37 puts the process in the
        // base untrusted_app domain and execve fails with EACCES.
        // Keeping 27 lets the same APK boot the container on Android 8.1..17.
        targetSdkVersion 27
        versionCode 10354
        versionName "0.5.4-${buildSerial}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        jniLibs {
            // MUST be legacy packaging: RomManager.ensureBootFiles symlinks
            // /data/data/io.twoyi/loader64 -> nativeLibraryDir/libloader.so
            // and the ROM init execv's TYLOADER, so libloader.so/libadb.so
            // have to exist on disk (Installer also execs libadb.so).
            useLegacyPackaging = true
        }
    }
    namespace 'io.twoyi'

    lint {
        // targetSdk 27 is deliberate (SELinux legacy partition keeps the
        // container bootstrap executable); AGP 9 lint escalates it to an
        // error and lintVitalRelease would fail the build.
        disable += 'ExpiredTargetSdkVersion'
        abortOnError = false
    }
}

base {
    archivesName = "twoyi_${android.defaultConfig.versionName}"
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'

    implementation 'com.github.tiann:FreeReflection:3.2.0'

    implementation "com.github.topjohnwu.libsu:core:5.2.1"

    // AboutPage
    implementation 'io.github.medyo:android-about-page:2.0.0'
    implementation 'de.psdev.licensesdialog:licensesdialog:1.9.0'
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'moe.feng:AlipayZeroSdk:1.1'

    implementation 'org.jdeferred:jdeferred-android-aar:1.2.6'
    implementation 'com.github.clans:fab:1.6.4'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    annotationProcessor 'androidx.annotation:annotation:1.7.0'

    implementation 'org.apache.commons:commons-compress:1.21'
    implementation 'org.tukaani:xz:1.5'

    implementation 'com.github.hzy3774:AndroidP7zip:1.7.2'
    implementation 'com.cleveroad:androidmanimation:0.9.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}