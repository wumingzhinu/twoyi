name: build-apk

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "rootfs.7z direct URL (optional; container ROM lives outside this repo)"
        required: false
        default: ""
      rom_ini_url:
        description: "rom.ini direct URL (optional ROM version info)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROOTFS_URL: ${{ inputs.rootfs_url || secrets.ROOTFS_URL }}
      ROM_INI_URL: ${{ inputs.rom_ini_url || secrets.ROM_INI_URL }}
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # sdkmanager is deprecated and blind to Android 17 packages; NDK 22 was
      # removed from the repository. Install exactly the pieces we need as
      # official zips and lay them out in the standard SDK directory layout.
      - name: Install SDK pieces (platform android-37, build-tools 37.0.0, NDK 29)
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK/platforms" "$SDK/build-tools" "$SDK/licenses"

          # platform android-37 (Android 17; Google ships it as 37.2)
          curl -fsSL --retry 3 -o "$HOME/p37.zip" \
            https://dl.google.com/android/repository/platform-37.2_r01.zip
          rm -rf "$SDK/platforms/android-37"
          unzip -q "$HOME/p37.zip" -d "$SDK/platforms"
          mv "$SDK/platforms/android-37.2" "$SDK/platforms/android-37"

          # build-tools 37.0.0
          curl -fsSL --retry 3 -o "$HOME/bt37.zip" \
            https://dl.google.com/android/repository/build-tools_r37_linux.zip
          rm -rf "$SDK/build-tools/37.0.0"
          unzip -q "$HOME/bt37.zip" -d "$SDK/build-tools"
          mv "$SDK/build-tools/android-37.0" "$SDK/build-tools/37.0.0"

          # NDK r29 stable (NDK 22 was removed from Google's repository)
          curl -fsSL --retry 3 -o "$HOME/ndk29.zip" \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          rm -rf "$HOME/android-ndk-r29" "$SDK/ndk/$NDK_VERSION"
          unzip -q "$HOME/ndk29.zip" -d "$HOME"
          mv "$HOME/android-ndk-r29" "$SDK/ndk/$NDK_VERSION"

          # license acceptance files (AGP refuses unlicensed platforms)
          printf '%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            84831b9409646a918e30573bab4c9c91346d8abd \
            > "$SDK/licenses/android-sdk-preview-license"

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ndk=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_OUTPUT"
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"
          "$SDK/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" --version | head -1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build libtwoyi.so (cargo, arm64-v8a)
        env:
          ANDROID_NDK_ROOT: ${{ steps.sdk.outputs.ndk }}
        run: |
          NDK="$ANDROID_NDK_ROOT"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          test -x "$CLANG" || { echo "::error::clang wrapper missing in NDK"; exit 1; }
          rustup target add aarch64-linux-android
          cd app/rs
          mkdir -p .cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$CLANG" > .cargo/config.toml
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build --release --target aarch64-linux-android
          cp -f target/aarch64-linux-android/release/libtwoyi.so ../src/main/jniLibs/arm64-v8a/
          ls -l ../src/main/jniLibs/arm64-v8a/libtwoyi.so

      - name: Inject container ROM (optional)
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$ROOTFS_URL" ]; then
            echo "Downloading rootfs.7z ..."
            curl -fL --retry 3 -o app/src/main/assets/rootfs.7z "$ROOTFS_URL"
            ls -lh app/src/main/assets/rootfs.7z
          else
            echo "No rootfs URL provided; APK compiles but container has no ROM."
          fi
          if [ -n "$ROM_INI_URL" ]; then
            curl -fL --retry 3 -o app/src/main/assets/rom.ini "$ROM_INI_URL"
          fi

      - name: Gradle build (assembleRelease)
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: twoyi-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
