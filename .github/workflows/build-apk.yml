name: build-apk

on:
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "rootfs.7z direct URL (optional; container ROM lives outside this repo)"
        required: false
        default: ""
      rom_ini_url:
        description: "rom.ini direct URL (optional ROM version info)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROOTFS_URL: ${{ inputs.rootfs_url || secrets.ROOTFS_URL }}
      ROM_INI_URL: ${{ inputs.rom_ini_url || secrets.ROM_INI_URL }}
      NDK_VERSION: 22.1.3931673
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android cmdline-tools (runner image ships no SDK)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Resolve SDK/NDK paths
        id: sdk
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ndk=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_OUTPUT"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sdkmanager missing after cmdline-tools install"
            exit 1
          fi

      - name: Install SDK components (android-37, build-tools 36, NDK 22)
        run: |
          SM="${{ steps.sdk.outputs.sdkmanager }}"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;36.0.0" "platform-tools" "ndk;$NDK_VERSION"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build libtwoyi.so (cargo-xdk, arm64-v8a only)
        env:
          ANDROID_NDK_HOME: ${{ steps.sdk.outputs.ndk }}
          ANDROID_NDK_ROOT: ${{ steps.sdk.outputs.ndk }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-xdk
          cd app/rs
          cargo xdk -t arm64-v8a -o ../src/main/jniLibs build --release
          ls -l ../src/main/jniLibs/arm64-v8a/

      - name: Inject container ROM (optional)
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$ROOTFS_URL" ]; then
            echo "Downloading rootfs.7z ..."
            curl -fL --retry 3 -o app/src/main/assets/rootfs.7z "$ROOTFS_URL"
            ls -lh app/src/main/assets/rootfs.7z
          else
            echo "No rootfs URL provided; APK compiles but container has no ROM."
          fi
          if [ -n "$ROM_INI_URL" ]; then
            curl -fL --retry 3 -o app/src/main/assets/rom.ini "$ROM_INI_URL"
          fi

      - name: Gradle build (assembleRelease)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: twoyi-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
