name: Build Twoyi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.2.9519653"

    - name: Set Environment
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Verify rootfs.7z
      run: |
        ls -lh app/src/main/assets/rootfs.7z
        file app/src/main/assets/rootfs.7z

    - name: Extract init from rootfs.7z to jniLibs
      run: |
        # Prepare output directory
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # Install 7z
        sudo apt-get install -y p7zip-full
        # Extract just the rootfs/init file (rootfs/init in the 7z)
        cd app/src/main/assets
        7z x -y rootfs.7z "rootfs/init" -o/tmp/rootfs_extract
        # Copy init to jniLibs so it gets packaged with exec permissions via APK install
        cp /tmp/rootfs_extract/rootfs/init ../jniLibs/arm64-v8a/libtwoyi_init.so
        ls -la ../jniLibs/arm64-v8a/libtwoyi_init.so
        echo "init extracted: $(file ../jniLibs/arm64-v8a/libtwoyi_init.so)"

    - name: Build HAL stub binary
      run: |
        # Compile as executable (not shared object) to get correct ELF TLS alignment
        # The twoyi loader handles ELF binaries in rootfs via execve interception
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
          -o /tmp/hal_stub \
          app/src/main/cpp/hal_stub.c
        # Rename to .so for Android package installer (only extracts .so from jniLibs)
        cp /tmp/hal_stub app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so
        file app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so

    - name: Build SwiftShader (software GPU)
      run: |
        sudo apt-get install -y cmake ninja-build
        git clone --depth 1 https://github.com/google/swiftshader.git /tmp/swiftshader
        mkdir -p /tmp/swiftshader/build
        cd /tmp/swiftshader/build
        cmake .. -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-27 \
          -DCMAKE_BUILD_TYPE=Release \
          -DSWIFTSHADER_BUILD_TESTS=OFF \
          -DSWIFTSHADER_BUILD_BENCHMARKS=OFF \
          -DREACTOR_BACKEND=Subzero \
          -DSWIFTSHADER_ENABLE_ASTC=OFF
        ninja
        # Find and copy SwiftShader libraries to jniLibs
        find . -name "libEGL_swiftshader.so" -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
        find . -name "libGLESv2_swiftshader.so" -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
        find . -name "libGLESv1_CM_swiftshader.so" -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
        echo "=== SwiftShader libraries ==="
        ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib*swiftshader*

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Rust libraries
      working-directory: app/rs
      run: sh build_rs.sh --release

    - name: Build APK
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci-latest
        name: "Twoyi CI Build #${{ github.run_number }}"
        body: |
          Automated build from commit ${{ github.sha }}
          - Android 7-16 compatible (API 24-36)
          - Portrait orientation
          - Debug & Release APKs
        files: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        overwrite_files: true
        make_latest: true