name: Build Twoyi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.2.9519653"

    - name: Set Environment
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Download original APK and extract rootfs
      run: |
        # Download original release APK
        curl -L -H "Accept: application/octet-stream" \
          "https://github.com/twoyi/twoyi/releases/download/0.5.4/twoyi_0.5.4-03211927-release.apk" \
          -o original.apk
        
        # Extract rootfs.7z from original APK
        unzip -o original.apk rootfs.7z -d /tmp/ || echo "rootfs.7z not found in APK"
        
        # Check if rootfs.7z exists
        if [ -f /tmp/rootfs.7z ]; then
          echo "rootfs.7z extracted successfully"
          ls -lh /tmp/rootfs.7z
        else
          echo "rootfs.7z not found, checking assets folder..."
          # Check if assets folder has rootfs
          ls -la app/src/main/assets/ || echo "No assets folder"
        fi

    - name: Copy rootfs to assets
      run: |
        mkdir -p app/src/main/assets
        if [ -f /tmp/rootfs.7z ]; then
          cp /tmp/rootfs.7z app/src/main/assets/
          echo "rootfs.7z copied to assets"
        elif [ -f app/src/main/assets/rootfs.7z ]; then
          echo "rootfs.7z already exists in assets"
        else
          echo "WARNING: rootfs.7z not found!"
          # Create a placeholder to avoid build failure
          touch app/src/main/assets/rootfs.7z
        fi
        ls -lh app/src/main/assets/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Rust libraries
      working-directory: app/rs
      run: sh build_rs.sh --release

    - name: Build APK
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
