name: Build Twoyi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.2.9519653"

    - name: Set Environment
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Verify rootfs.7z
      run: |
        ls -lh app/src/main/assets/rootfs.7z
        file app/src/main/assets/rootfs.7z

    - name: Extract init from rootfs.7z to jniLibs
      run: |
        # Prepare output directory
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # Install 7z
        sudo apt-get install -y p7zip-full
        # Extract just the rootfs/init file (rootfs/init in the 7z)
        cd app/src/main/assets
        7z x -y rootfs.7z "rootfs/init" -o/tmp/rootfs_extract
        # Copy init to jniLibs so it gets packaged with exec permissions via APK install
        cp /tmp/rootfs_extract/rootfs/init ../jniLibs/arm64-v8a/libtwoyi_init.so
        ls -la ../jniLibs/arm64-v8a/libtwoyi_init.so
        echo "init extracted: $(file ../jniLibs/arm64-v8a/libtwoyi_init.so)"

    - name: Build HAL stub binary
      run: |
        # Compile as executable (not shared object) to get correct ELF TLS alignment
        # The twoyi loader handles ELF binaries in rootfs via execve interception
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
          -o /tmp/hal_stub \
          app/src/main/cpp/hal_stub.c
        # Rename to .so for Android package installer (only extracts .so from jniLibs)
        cp /tmp/hal_stub app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so
        file app/src/main/jniLibs/arm64-v8a/libtwoyi_hal_stub.so

    - name: Build SwiftShader (software GPU)
      continue-on-error: true
      run: |
        sudo apt-get install -y cmake ninja-build
        for i in 1 2 3 4 5; do
          git clone --depth 1 --recurse-submodules https://github.com/google/swiftshader.git /tmp/swiftshader && break
          echo "Clone attempt $i failed, retrying..."
          rm -rf /tmp/swiftshader
          sleep 15
        done
        if [ ! -d /tmp/swiftshader ]; then echo "SwiftShader clone failed, skipping"; exit 0; fi
        # Checkout submodules (llvm-subzero)
        git -C /tmp/swiftshader submodule update --init --depth 1 -- third_party/llvm-subzero || echo "submodule checkout failed"
        # Create missing LLVM config headers (generated by LLVM build, not in submodule)
        mkdir -p /tmp/swiftshader/third_party/llvm-subzero/include/llvm/Config
        printf '%s\n' \
          '#ifndef LLVM_CONFIG_LLVM_CONFIG_H' \
          '#define LLVM_CONFIG_LLVM_CONFIG_H' \
          '#define LLVM_VERSION_MAJOR 10' \
          '#define LLVM_VERSION_MINOR 0' \
          '#define LLVM_VERSION_PATCH 0' \
          '#define LLVM_VERSION_STRING "10.0.0"' \
          '#define LLVM_ON_UNIX 1' \
          '#define LLVM_NATIVE_ARCH ARM' \
          '#define LLVM_HOST_ARCH ARM' \
          '#define LLVM_DEFAULT_TARGET_TRIPLE "aarch64-linux-android"' \
          '#define LLVM_HOST_TUPLE "aarch64-linux-android"' \
          '#define LLVM_DEFAULT_TARGET_OS "Linux"' \
          '#define LLVM_HAS_ELF_OBJECT_FORMAT 1' \
          '#define LLVM_HAS_MACHO_OBJECT_FORMAT 0' \
          '#define LLVM_HAS_COFF_OBJECT_FORMAT 0' \
          '#define LLVM_ENABLE_THREADS 1' \
          '#define LLVM_ENABLE_ABI_INSTRUMENTATION 0' \
          '#define LLVM_ENABLE_ZLIB 0' \
          '#define LLVM_ENABLE_LIBXML2 0' \
          '#define LLVM_ENABLE_TERMINFO 0' \
          '#define LLVM_ENABLE_EDITLINE 0' \
          '#define LLVM_ENABLE_LIBPFM 0' \
          '#define LLVM_ENABLE_ZSTD 0' \
          '#define LLVM_ENABLE_CURSES 0' \
          '#define LLVM_ENABLE_BACKTRACES 1' \
          '#define LLVM_ENABLE_RTTI 0' \
          '#define LLVM_ENABLE_PIC 1' \
          '#define LLVM_HAS_GLOBAL_ISL 0' \
          '#define LLVM_ENABLE_BINDGEN 0' \
          '#define LLVM_ENABLE_PGO_INSTRUMENT 0' \
          '#endif' \
          > /tmp/swiftshader/third_party/llvm-subzero/include/llvm/Config/llvm-config.h
        mkdir -p /tmp/swiftshader/third_party/llvm-subzero/include/llvm/Support
        printf '%s\n' \
          '#ifndef LLVM_SUPPORT_DATATYPES_H' \
          '#define LLVM_SUPPORT_DATATYPES_H' \
          '#include <stdint.h>' \
          'typedef uint8_t  uint8_t_;' \
          'typedef int8_t   int8_t_;' \
          'typedef uint16_t uint16_t_;' \
          'typedef int16_t  int16_t_;' \
          'typedef uint32_t uint32_t_;' \
          'typedef int32_t  int32_t_;' \
          'typedef uint64_t uint64_t_;' \
          'typedef int64_t  int64_t_;' \
          '#endif' \
          > /tmp/swiftshader/third_party/llvm-subzero/include/llvm/Support/DataTypes.h
        find /tmp/swiftshader -name "CMakeLists.txt" -exec grep -l "Platform does not support Vulkan yet" {} \; | while read f; do
          LINE_NUM=$(grep -n "Platform does not support Vulkan yet" "$f" | head -1 | cut -d: -f1)
          [ -n "$LINE_NUM" ] && sed -i "${LINE_NUM}s/FATAL_ERROR/WARNING/" "$f"
        done
        mkdir -p /tmp/swiftshader/build && cd /tmp/swiftshader/build
        cmake .. -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-27 \
          -DCMAKE_BUILD_TYPE=Release \
          -DSWIFTSHADER_BUILD_TESTS=OFF \
          -DSWIFTSHADER_BUILD_BENCHMARKS=OFF \
          -DREACTOR_BACKEND=Subzero \
          -DSWIFTSHADER_ENABLE_ASTC=OFF
        ninja || echo "SwiftShader build failed, continuing without it"
        find . \( -name "libEGL_swiftshader.so" -o -name "libGLESv2_swiftshader.so" -o -name "libGLESv1_CM_swiftshader.so" \) \
          -exec cp {} $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/ \;
        ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib*swiftshader* 2>/dev/null || echo "SwiftShader not built"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Rust libraries
      working-directory: app/rs
      run: |
        for attempt in 1 2 3 4 5; do
          echo "=== Rust build attempt $attempt ==="
          if sh build_rs.sh --release; then
            echo "Build succeeded on attempt $attempt"
            break
          fi
          echo "Build failed on attempt $attempt, retrying in 30s..."
          sleep 30
        done

    - name: Build APK
      run: |
        for attempt in 1 2 3 4 5; do
          echo "=== Gradle build attempt $attempt ==="
          if ./gradlew assembleDebug assembleRelease; then
            echo "APK build succeeded on attempt $attempt"
            break
          fi
          echo "APK build failed on attempt $attempt, retrying in 30s..."
          sleep 30
        done
        echo "=== APK output files ==="
        find app/build/outputs -name "*.apk" -ls 2>/dev/null || echo "No APK files found"
        # Copy all APKs to a known flat directory
        mkdir -p apk-output
        find app/build/outputs -name "*.apk" -exec cp {} apk-output/ \;
        echo "=== Copied APKs ==="
        ls -la apk-output/ 2>/dev/null || echo "No APKs copied"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-debug-apk
        path: apk-output/*.apk
        retention-days: 7
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-release-apk
        path: apk-output/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Create GitHub Release
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ci-latest
        name: "Twoyi CI Build #${{ github.run_number }}"
        body: |
          Automated build from commit ${{ github.sha }}
          - Android 7-16 compatible (API 24-36)
          - Portrait orientation
          - Debug & Release APKs
        files: apk-output/*.apk
        make_latest: true