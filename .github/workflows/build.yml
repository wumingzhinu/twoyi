name: Build Twoyi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Android NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;25.2.9519653"

    - name: Set Environment
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Download rootfs from Release
      run: |
        mkdir -p app/src/main/assets
        # Download rootfs.7z from our repository's Release
        curl -L -H "Accept: application/octet-stream" \
          "https://github.com/wumingzhinu/twoyi/releases/download/rootfs-0.5.4/rootfs.7z" \
          -o app/src/main/assets/rootfs.7z
        ls -lh app/src/main/assets/rootfs.7z

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Rust libraries
      working-directory: app/rs
      run: sh build_rs.sh --release

    - name: Build APK
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30